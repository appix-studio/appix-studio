<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">APPIX STUDIO — Des sites qui vous ressemblent</title>
<desc id="desc">Bannière éditoriale fidèle au site APPIX : fond ivoire, typographie serif bleu nuit et bordeaux, fenêtres superposées présentant les projets web.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFAF7"/><stop offset="1" stop-color="#E7E8E4"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16264A"/><stop offset="1" stop-color="#0E1A33"/></linearGradient>
 <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8A3448"/><stop offset="1" stop-color="#531723"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0E1A33" flood-opacity=".18"/></filter>
 <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#0E1A33" opacity=".10"/></pattern>
 <clipPath id="clip"><rect width="1280" height="440" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1280" height="440" fill="url(#paper)"/><rect width="1280" height="440" fill="url(#grain)" opacity=".28"/>
 <path d="M0 0H1280M0 439H1280" stroke="#0E1A33" stroke-opacity=".14"/>
 <!-- signature -->
 <g transform="translate(58 36)">
  <text x="0" y="23" fill="#0E1A33" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="-1.7">APPIX</text>
  <text x="69" y="23" fill="#6D1F2F" font-family="Arial,sans-serif" font-size="10" letter-spacing="2.6">STUDIO</text>
  <circle cx="1" cy="39" r="2.5" fill="#6D1F2F"/>
  <text x="13" y="42" fill="#566075" font-family="monospace" font-size="9" letter-spacing="1.6">WEB DESIGN &amp; DEVELOPMENT</text>
 </g>
 <text x="60" y="112" fill="#6D1F2F" font-family="monospace" font-size="11" letter-spacing="2.4">CRÉATION DE SITES WEB SUR DEMANDE</text>
 <!-- oversized editorial heading -->
 <text x="54" y="217" fill="#0E1A33" font-family="Georgia,serif" font-size="105" font-weight="600" letter-spacing="-5.8">Des sites</text>
 <text x="56" y="302" fill="#0E1A33" font-family="Georgia,serif" font-size="105" font-weight="600" letter-spacing="-5.8">qui <tspan fill="#6D1F2F" font-style="italic">vous</tspan></text>
 <text x="56" y="386" fill="#6D1F2F" font-family="Georgia,serif" font-size="104" font-weight="600" font-style="italic" letter-spacing="-5.8">ressemblent.</text>
 <!-- outlined echo -->
 <text x="58" y="217" fill="none" stroke="#0E1A33" stroke-opacity=".13" stroke-width="1" font-family="Georgia,serif" font-size="105" font-weight="600" letter-spacing="-5.8">Des sites</text>
 <!-- right portfolio collage -->
 <g filter="url(#shadow)" transform="translate(730 64) rotate(-5 210 140)">
  <rect width="390" height="245" rx="8" fill="#FAFAF7" stroke="#0E1A33" stroke-opacity=".22"/>
  <path d="M0 31H390" stroke="#C2C6C2"/>
  <circle cx="16" cy="15" r="4" fill="#6D1F2F"/><circle cx="30" cy="15" r="4" fill="#BCCF9A"/><circle cx="44" cy="15" r="4" fill="#C2C6C2"/>
  <text x="62" y="19" fill="#566075" font-family="monospace" font-size="9">bat-innov.fr</text>
  <rect x="14" y="45" width="362" height="185" rx="3" fill="#E4ECD5"/>
  <rect x="14" y="45" width="362" height="185" rx="3" fill="url(#navy)" opacity=".08"/>
  <text x="35" y="78" fill="#0E1A33" font-family="monospace" font-size="8" letter-spacing="1.8">BÂT INNOV</text>
  <text x="35" y="130" fill="#0E1A33" font-family="Georgia,serif" font-size="37" font-weight="600">Construire</text>
  <text x="35" y="164" fill="#6D1F2F" font-family="Georgia,serif" font-size="37" font-style="italic">durablement.</text>
  <rect x="35" y="184" width="92" height="25" rx="3" fill="#0E1A33"/>
  <text x="81" y="200" text-anchor="middle" fill="#FAFAF7" font-family="Arial,sans-serif" font-size="8">DÉCOUVRIR</text>
  <path d="M280 45V230" stroke="#FAFAF7" stroke-opacity=".8" stroke-width="1"/>
  <circle cx="324" cy="137" r="55" fill="#BCCF9A"/><circle cx="324" cy="137" r="39" fill="#35508F"/><path d="M295 158L324 91L353 158Z" fill="#FAFAF7" opacity=".8"/>
 </g>
 <g filter="url(#shadow)" transform="translate(864 248) rotate(4 150 75)">
  <rect width="290" height="156" rx="7" fill="#FAFAF7" stroke="#0E1A33" stroke-opacity=".2"/>
  <path d="M0 26H290" stroke="#C2C6C2"/>
  <circle cx="14" cy="13" r="3" fill="#6D1F2F"/><circle cx="25" cy="13" r="3" fill="#BCCF9A"/><circle cx="36" cy="13" r="3" fill="#C2C6C2"/>
  <rect x="10" y="36" width="270" height="110" rx="3" fill="#0E1A33"/>
  <text x="25" y="62" fill="#BCCF9A" font-family="monospace" font-size="8" letter-spacing="1.5">MG PIXEL / ZORVÉK / PIERRE YOUDINE</text>
  <text x="25" y="103" fill="#FAFAF7" font-family="Georgia,serif" font-size="31">Des univers</text>
  <text x="25" y="132" fill="#FAFAF7" font-family="Georgia,serif" font-size="31" font-style="italic">qui marquent.</text>
 </g>
 <!-- project count seal -->
 <g transform="translate(1166 66)">
  <circle r="43" fill="#6D1F2F"/><circle r="36" fill="none" stroke="#FAFAF7" stroke-opacity=".55" stroke-dasharray="1 3"/>
  <text y="-3" text-anchor="middle" fill="#FAFAF7" font-family="Georgia,serif" font-size="28">06</text>
  <text y="14" text-anchor="middle" fill="#FAFAF7" font-family="monospace" font-size="7" letter-spacing="1.2">PROJETS</text>
 </g>
 <path d="M60 411H1220" stroke="#0E1A33" stroke-opacity=".22"/>
 <text x="62" y="429" fill="#566075" font-family="monospace" font-size="9" letter-spacing="1.4">SUR MESURE · RESPONSIVE · DEVIS GRATUIT</text>
 <text x="1217" y="429" text-anchor="end" fill="#6D1F2F" font-family="monospace" font-size="9" letter-spacing="1.5">APPIX-STUDIO.FR ↗</text>
</g></svg>