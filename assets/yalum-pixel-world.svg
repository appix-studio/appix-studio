<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">APPIX Studio — Des sites web qui prennent vie</title>
<desc id="desc">Bannière inspirée du vrai site APPIX : fond encre, typographie éditoriale, citron vert, corail et aperçu d'une page web avec ses interfaces et son code.</desc>
