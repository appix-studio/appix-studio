<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">APPIX STUDIO — Six projets. Une signature.</title>
<desc id="desc">Bannière inspirée du portfolio APPIX STUDIO : bleu nuit, typographie Fraunces éditoriale, accent vert sauge, orbite bordeaux et statistiques des six projets.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E1A33"/><stop offset="1" stop-color="#16264A"/></linearGradient>
  <radialGradient id="wine" cx="34%" cy="28%" r="75%"><stop stop-color="#A24457"/><stop offset=".55" stop-color="#6D1F2F"/><stop offset="1" stop-color="#3A1726"/></radialGradient>
  <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#F4F4F0" opacity=".12"/></pattern>
  <clipPath id="clip"><rect width="1280" height="440" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="440" fill="url(#bg)"/>
<rect width="1280" height="440" fill="url(#grain)" opacity=".34"/>
<path d="M0 0H1280V440H0Z" fill="none" stroke="#F4F4F0" stroke-opacity=".07"/>
<!-- wordmark -->
<g transform="translate(62 38)">
  <path d="M0 30L17 0L34 30" fill="none" stroke="#F4F4F0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="21" r="4.1" fill="#BCCF9A"/>
  <text x="49" y="21" fill="#F4F4F0" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2.2">APPIX</text>
  <text x="51" y="36" fill="#AEB7C7" font-family="Arial,sans-serif" font-size="8" letter-spacing="5.4">STUDIO</text>
</g>
<text x="64" y="112" fill="#BCCF9A" font-family="monospace" font-size="12" letter-spacing="2.5">PORTFOLIO · 2026</text>
<!-- headline -->
<text x="58" y="222" fill="#F4F4F0" font-family="Georgia,serif" font-size="105" font-weight="600" letter-spacing="-5">Six projets.</text>
<text x="62" y="316" fill="#BCCF9A" font-family="Georgia,serif" font-size="100" font-style="italic" font-weight="600" letter-spacing="-4">Une signature.</text>
<text x="65" y="358" fill="#F4F4F0" fill-opacity=".7" font-family="Arial,sans-serif" font-size="16">Sites web sur mesure · Missions réelles · Concepts</text>
<!-- orbital motif -->
<g transform="translate(1000 207)">
  <circle r="176" fill="none" stroke="#F4F4F0" stroke-opacity=".18" stroke-width="1"/>
  <circle r="146" fill="none" stroke="#BCCF9A" stroke-opacity=".38" stroke-width="1" stroke-dasharray="2 8"/>
  <circle r="116" fill="none" stroke="#A24457" stroke-opacity=".7" stroke-width="1.5"/>
  <circle r="82" fill="url(#wine)"/>
  <path d="M-36 -25Q-8 -58 27 -36" fill="none" stroke="#F4F4F0" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"/>
  <circle cx="0" cy="-146" r="8" fill="#BCCF9A"/>
  <circle cx="145" cy="0" r="5" fill="#A24457"/>
  <circle cx="-103" cy="103" r="4" fill="#F4F4F0" fill-opacity=".65"/>
</g>
<!-- stats strip -->
<path d="M64 386H1216" stroke="#F4F4F0" stroke-opacity=".2"/>
<g font-family="monospace">
  <text x="65" y="414" fill="#AEB7C7" font-size="10" letter-spacing="1.8">PROJETS</text>
  <text x="65" y="436" fill="#F4F4F0" font-family="Georgia,serif" font-size="24">06</text>
  <path d="M250 397V440" stroke="#F4F4F0" stroke-opacity=".16"/>
  <text x="280" y="414" fill="#AEB7C7" font-size="10" letter-spacing="1.8">MISSIONS RÉELLES</text>
  <text x="280" y="436" fill="#F4F4F0" font-family="Georgia,serif" font-size="24">03</text>
  <path d="M495 397V440" stroke="#F4F4F0" stroke-opacity=".16"/>
  <text x="525" y="414" fill="#AEB7C7" font-size="10" letter-spacing="1.8">CONCEPTS FICTIFS</text>
  <text x="525" y="436" fill="#F4F4F0" font-family="Georgia,serif" font-size="24">02</text>
  <path d="M750 397V440" stroke="#F4F4F0" stroke-opacity=".16"/>
  <text x="780" y="414" fill="#AEB7C7" font-size="10" letter-spacing="1.8">PROJET PERSONNEL</text>
  <text x="780" y="436" fill="#F4F4F0" font-family="Georgia,serif" font-size="24">01</text>
</g>
<text x="1215" y="425" text-anchor="end" fill="#F4F4F0" fill-opacity=".4" font-family="monospace" font-size="9" letter-spacing="1.5">APPIX STUDIO®</text>
</g></svg>